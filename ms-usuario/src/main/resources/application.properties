spring.application.name=ms-usuario

server.port=8083

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_ecotienda}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.security.user.name=admin
spring.security.user.password=admin123

ms.rol.url=${MS_ROL_URL:http://localhost:8082}
ms.rol.user=admin
ms.rol.password=admin123

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

eureka.instance.hostname=ms-usuario
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${server.port}

eureka.instance.status-page-url=http://localhost:8080/api/usuarios
eureka.instance.home-page-url=http://localhost:8080/api/usuarios