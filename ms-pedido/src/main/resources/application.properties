spring.application.name=ms-pedido
server.port=8089

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_ecotienda}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

spring.security.user.name=admin
spring.security.user.password=admin123

ms.usuario.url=${MS_USUARIO_URL:http://localhost:8083}
ms.usuario.user=admin
ms.usuario.password=admin123

ms.producto.url=${MS_PRODUCTO_URL:http://localhost:8086}
ms.producto.user=admin
ms.producto.password=admin123

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}

eureka.instance.hostname=ms-pedido
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${server.port}

eureka.instance.status-page-url=http://localhost:8080/api/pedidos
eureka.instance.home-page-url=http://localhost:8080/api/pedidos